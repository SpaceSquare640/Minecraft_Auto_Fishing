# Release: pushing a version tag (v1.2.3) builds the Windows installers on GitHub's runners and
# creates a draft release with build provenance. Release files: the two installers, one zip with
# both resource packs, and SHA256SUMS.txt. The maintainer checks the draft and publishes it.
#
# Security rules (CLAUDE.md §9.2): permissions per job, GitHub-owned actions pinned to full SHAs,
# no credentials persisted, no secrets, no caches. Packages are installed only from the lockfiles
# (npm ci --ignore-scripts, cargo --locked); the build job has read-only access and the release
# job, which can write, runs none of the project's code.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read # check out the tagged source
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import json, os, sys
          version = os.environ["TAG"].removeprefix("v")
          app_version = json.load(open("app/src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          if version != app_version:
              sys.exit(f"tag {version} does not match the app version {app_version}")

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install front-end packages (lockfile only, no install scripts)
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build the installers (Rust toolchain from rust-toolchain.toml, Cargo.lock only)
        working-directory: app
        run: npm run tauri -- build --bundles nsis,msi -- --locked

      - name: Collect the release files
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import glob, hashlib, io, os, shutil, zipfile
          version = os.environ["TAG"].removeprefix("v")  # checked against the app version above
          base = f"Minecraft-Auto-Fishing_{version}"
          os.makedirs("dist")
          [setup] = glob.glob("target/release/bundle/nsis/*-setup.exe")
          [msi] = glob.glob("target/release/bundle/msi/*.msi")
          shutil.copy(setup, f"dist/{base}_x64-setup.exe")
          shutil.copy(msi, f"dist/{base}_x64_en-US.msi")

          def pack(folder):
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in sorted(os.walk(folder)):
                      for name in sorted(files):
                          path = os.path.join(root, name)
                          z.write(path, os.path.relpath(path, folder).replace(os.sep, "/"))
              return buf.getvalue()

          bedrock = pack("resource-packs/bedrock/AMF_Bite_Caption")
          java = pack("resource-packs/java/AMF_Bite_Caption")
          readme = (
              "Minecraft Auto Fishing - Bite Caption resource packs\r\n\r\n"
              "They give the fishing bite its own subtitle, [AMF] BITE, and change nothing else.\r\n"
              "The app can install them for you (Setup tab).\r\n\r\n"
              "Bedrock: double-click bedrock/AMF_Bite_Caption.mcpack, activate it in Settings > Global Resources, turn on captions.\r\n"
              "Java (optional): copy java/AMF_Bite_Caption.zip into .minecraft/resourcepacks and select it in Options > Resource Packs.\r\n\r\n"
              "License: GPL-3.0. Not affiliated with Mojang or Microsoft.\r\n"
          )
          with zipfile.ZipFile(f"dist/{base}_resource-packs.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("bedrock/AMF_Bite_Caption.mcpack", bedrock)
              z.writestr("java/AMF_Bite_Caption.zip", java)
              z.writestr("README.txt", readme)

          with open("dist/SHA256SUMS.txt", "w", newline="\n") as sums:
              for name in sorted(os.listdir("dist")):
                  if name != "SHA256SUMS.txt":
                      digest = hashlib.sha256(open(f"dist/{name}", "rb").read()).hexdigest()
                      sums.write(f"{digest}  {name}\n")
          print(open("dist/SHA256SUMS.txt").read())

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release with build provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write release notes
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          import base64, json, os, pathlib, re, sys, urllib.parse, urllib.request

          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          base = f"Minecraft-Auto-Fishing_{version}"
          descriptions = {
              f"{base}_x64-setup.exe": "Installer (recommended)",
              f"{base}_x64_en-US.msi": "MSI installer, for managed installs",
              f"{base}_resource-packs.zip": "Both resource packs (Bedrock and Java) with install notes",
              "SHA256SUMS.txt": "SHA-256 checksums",
          }
          actual = {path.name for path in pathlib.Path("dist").iterdir() if path.is_file()}
          if actual != descriptions.keys():
              sys.exit(f"Unexpected release assets: expected {sorted(descriptions)}, got {sorted(actual)}")

          repo = os.environ["REPO"]
          url = f"https://api.github.com/repos/{repo}/contents/Change%20Log.md?ref={urllib.parse.quote(tag, safe='')}"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              change_log = base64.b64decode(json.load(response)["content"]).decode("utf-8")
          headings = change_log.splitlines()
          heading = re.compile(rf"^## {re.escape(version)}(?:\s|$)")
          start = next((i + 1 for i, line in enumerate(headings) if heading.match(line)), None)
          if start is None:
              sys.exit(f"No Change Log section for {version}")
          end = next((i for i in range(start, len(headings)) if headings[i].startswith("## ")), len(headings))
          changes = "\n".join(headings[start:end]).strip()
          if not changes:
              sys.exit(f"Empty Change Log section for {version}")

          lines = [
              "**Windows release.** macOS and Linux are not supported yet.",
              "",
              "### Supported",
              "| Edition | Platform |",
              "|---|---|",
              "| Minecraft: Java Edition 1.21 and later | Windows 10 / 11 |",
              "| Minecraft: Bedrock Edition 1.21 and later | Windows 10 / 11 |",
              "",
              "Consoles and mobile devices are not supported.",
              "",
              "### Changes in this release",
              changes,
              "",
              "### Downloads",
              "| File | What it is |",
              "|---|---|",
              *(f"| `{name}` | {description} |" for name, description in descriptions.items()),
              "",
              "### Before you start",
              "- **Java Edition:** turn on subtitles (Options › Accessibility › Show Subtitles).",
              "- **Bedrock Edition:** install the Bite Caption pack, activate it in Settings › Global Resources and turn on captions.",
              "- Hold a fishing rod, face the water, **reel in your line**, then press **F8** in the game. Press F8 again to stop.",
              "",
              "### Known issues",
              '- The installer is not code-signed yet. Windows SmartScreen may say "Windows protected your PC": choose **More info › Run anyway**.',
              "- Microsoft Defender may flag a new, unsigned installer. Compare its checksum with `SHA256SUMS.txt` before installing.",
              "",
              "### Verify the files",
              "These files were built by GitHub Actions from this repository, with build provenance. To check a file:",
              "",
              "```",
              f"gh attestation verify <file> --repo {repo} --signer-workflow {repo}/.github/workflows/release.yml --source-ref refs/tags/{tag} --deny-self-hosted-runners",
              "```",
              "",
              f"Full list of changes: [Change Log](https://github.com/{repo}/blob/Source_Code/Change%20Log.md)",
              "",
              "Many multiplayer servers do not allow automated fishing. Check the rules of the server you play on.",
          ]
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag
          --title "Minecraft Auto Fishing ${TAG#v}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
