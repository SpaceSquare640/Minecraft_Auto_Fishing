# Validate proposed Source_Code changes on GitHub-hosted Windows runners.
name: Source PR checks

on:
  pull_request:
    branches:
      - Source_Code
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting Source_Code
        required: true
        type: number

permissions: {}

concurrency:
  group: source-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/Source_Code'
    name: Format, lint, test, and app build
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read # validate the selected PR's state and base branch for manual runs
    steps:
      - name: Validate manually selected pull request
        if: github.event_name == 'workflow_dispatch'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          import json, os, sys, urllib.request

          number = os.environ["PR_NUMBER"]
          if not number.isdecimal():
              sys.exit("PR number must be a positive integer")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              pull_request = json.load(response)
          if pull_request["state"] != "open" or pull_request["base"]["ref"] != "Source_Code":
              sys.exit("Selected pull request must be open and target Source_Code")

      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || format('refs/pull/{0}/merge', inputs.pr_number) }}
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install app packages from lockfile
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build app UI
        working-directory: app
        run: npm run build
