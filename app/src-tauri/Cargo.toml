[package]
name = "minecraft-auto-fishing"
description = "Minecraft Auto Fishing desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
maf-detectors = { path = "../../crates/detectors" }
maf-engine = { path = "../../crates/engine" }
maf-game-profile = { path = "../../crates/game-profile" }
maf-platform-win = { path = "../../crates/platform-win" }
