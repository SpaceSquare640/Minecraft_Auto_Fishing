# Read-only dependency report. Dependabot handles GitHub Actions updates separately.
name: Monthly dependency update report

on:
  schedule:
    - cron: "17 3 1 * *" # First day of month, 11:17 Hong Kong time
  workflow_dispatch:

permissions: {}

concurrency:
  group: monthly-dependency-report
  cancel-in-progress: false

jobs:
  report:
    name: Check Cargo and npm updates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/Source_Code
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install app packages from lockfile
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Check available Cargo updates
        id: cargo
        shell: bash
        run: |
          cargo update --dry-run > "$RUNNER_TEMP/cargo-updates.txt" 2>&1

      - name: Check available npm updates
        id: npm
        working-directory: app
        shell: bash
        run: |
          npm outdated --json > "$RUNNER_TEMP/npm-updates.json" 2> "$RUNNER_TEMP/npm-errors.txt" || status=$?
          if [[ "${status:-0}" -gt 1 ]]; then
            cat "$RUNNER_TEMP/npm-errors.txt"
            exit "$status"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dependency update report'
            echo
            echo 'This report checks available updates without changing the repository.'
            echo
            echo '### Cargo lockfile updates'
            if [[ -f "$RUNNER_TEMP/cargo-updates.txt" ]]; then
              echo '```text'
              cat "$RUNNER_TEMP/cargo-updates.txt"
              echo '```'
            else
              echo 'Cargo check did not complete.'
            fi
            echo
            echo '### npm package updates'
            if [[ -s "$RUNNER_TEMP/npm-updates.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/npm-updates.json"
              echo '```'
            else
              echo 'No npm updates reported, or the npm check did not complete.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
