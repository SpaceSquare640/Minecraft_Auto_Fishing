<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minecraft Auto Fishing</title>
    <script type="module" crossorigin src="./assets/index-CVaA-aSd.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-bp_1AdEE.css">
  </head>
  <body>
    <header class="top">
      <img class="top__icon" src="./assets/icon-DTX1ppVp.webp" alt="" width="40" height="40">
      <div>
        <h1 class="top__title">Minecraft Auto Fishing</h1>
        <p class="top__version" id="version"></p>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-fishing" aria-controls="panel-fishing" aria-selected="true" data-i18n="tabs.fishing"></button>
      <button class="tab" role="tab" id="tab-setup" aria-controls="panel-setup" aria-selected="false" tabindex="-1" data-i18n="tabs.setup"></button>
      <button class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1" data-i18n="tabs.settings"></button>
      <button class="tab" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1" data-i18n="tabs.about"></button>
    </nav>

    <main>
      <section class="panel" role="tabpanel" id="panel-fishing" aria-labelledby="tab-fishing">
        <p class="state"><span data-i18n="state.label"></span>: <strong id="state"></strong></p>
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="buttons">
          <button class="btn" id="start" type="button" data-i18n="fishing.start"></button>
          <button class="btn btn--secondary" id="stop" type="button" data-i18n="fishing.stop"></button>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="warning" id="no-bite" role="status" hidden></p>
        <dl class="grid">
          <dt data-i18n="fishing.casts"></dt><dd id="casts">0</dd>
          <dt data-i18n="fishing.bites"></dt><dd id="bites">0</dd>
          <dt data-i18n="fishing.timeouts"></dt><dd id="timeouts">0</dd>
          <dt data-i18n="fishing.resyncs"></dt><dd id="resyncs">0</dd>
        </dl>
        <dl class="details">
          <dt data-i18n="fishing.game"></dt><dd id="game"></dd>
          <dt data-i18n="fishing.focus"></dt><dd id="focus"></dd>
          <dt data-i18n="fishing.capture"></dt><dd id="fps"></dd>
          <dt data-i18n="fishing.detection"></dt><dd id="detection"></dd>
          <dt data-i18n="fishing.lastBite"></dt><dd id="last-bite"></dd>
        </dl>
        <h2 class="subhead" data-i18n="fishing.events"></h2>
        <ol class="events" id="events" aria-live="off"></ol>
      </section>

      <section class="panel" role="tabpanel" id="panel-setup" aria-labelledby="tab-setup" hidden>
        <h2 class="subhead" data-i18n="setup.title"></h2>
        <p id="setup-common"></p>
        <h3 data-i18n="setup.java"></h3>
        <ul class="steps">
          <li data-i18n="setup.java1"></li>
          <li data-i18n="setup.java2"></li>
        </ul>
        <button class="btn btn--secondary" id="install-java" type="button" data-i18n="setup.javaInstall"></button>
        <h3 data-i18n="setup.bedrock"></h3>
        <ul class="steps">
          <li data-i18n="setup.bedrock1"></li>
          <li data-i18n="setup.bedrock2"></li>
          <li id="setup-bedrock3"></li>
        </ul>
        <button class="btn" id="install-bedrock" type="button" data-i18n="setup.bedrockInstall"></button>
        <p class="note" id="pack-result" role="status"></p>
      </section>

      <section class="panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <label class="toggle"><input type="checkbox" id="save-logs"> <span data-i18n="settings.saveLogs"></span></label>
        <p class="note" data-i18n="settings.saveLogsHelp"></p>
        <button class="btn btn--secondary" id="open-logs" type="button" data-i18n="settings.openLogs"></button>
        <label class="toggle"><input type="checkbox" id="check-updates"> <span data-i18n="settings.checkUpdates"></span></label>
        <p class="note" data-i18n="settings.checkUpdatesHelp"></p>
        <p class="note" id="settings-result" role="status"></p>
      </section>

      <section class="panel" role="tabpanel" id="panel-about" aria-labelledby="tab-about" hidden>
        <p id="about-version"></p>
        <div class="buttons">
          <button class="btn btn--secondary" id="check-now" type="button" data-i18n="about.checkNow"></button>
          <button class="btn" id="download" type="button" data-i18n="about.download" hidden></button>
        </div>
        <p id="update-result" role="status"></p>
        <div class="buttons buttons--links">
          <button class="btn btn--secondary" type="button" data-link="github" data-i18n="about.github"></button>
          <button class="btn btn--secondary" type="button" data-link="discord" data-i18n="about.discord"></button>
          <button class="btn btn--secondary" type="button" data-link="website" data-i18n="about.website"></button>
        </div>
        <p class="note" data-i18n="about.license"></p>
      </section>
    </main>

    <footer class="build" id="build"></footer>

    <dialog id="intro" aria-labelledby="intro-title">
      <h2 id="intro-title" data-i18n="intro.title"></h2>
      <p data-i18n="intro.body1"></p>
      <p data-i18n="intro.body2"></p>
      <p data-i18n="intro.body3"></p>
      <button class="btn" id="intro-ok" type="button" data-i18n="intro.ok"></button>
    </dialog>

    <dialog id="confirm" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div class="buttons">
        <button class="btn" id="confirm-yes" type="button" data-i18n="dialog.yes"></button>
        <button class="btn btn--secondary" id="confirm-no" type="button" data-i18n="dialog.no"></button>
      </div>
    </dialog>
  </body>
</html>
