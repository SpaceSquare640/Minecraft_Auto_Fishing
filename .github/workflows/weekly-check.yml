# Scheduled checks run from the default Source_Code branch.
name: Weekly source check

on:
  schedule:
    - cron: "17 2 * * 3" # Wednesday 10:17 Hong Kong time
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-source-check
  cancel-in-progress: false

jobs:
  check:
    name: Format, lint, test, and app build
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/Source_Code
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install app packages from lockfile
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build app UI
        working-directory: app
        run: npm run build
