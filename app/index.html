<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minecraft Auto Fishing</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="panel">
      <h1>Minecraft Auto Fishing</h1>
      <p class="state">State: <strong id="state">idle</strong></p>
      <p id="hint" class="hint" aria-live="polite"></p>
      <div class="buttons">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" class="secondary">Stop</button>
      </div>
      <dl class="stats">
        <dt>Game</dt><dd id="game">Not found</dd>
        <dt>Focus</dt><dd id="focus">Not in game</dd>
        <dt>Capture</dt><dd id="fps">-</dd>
        <dt>Detection</dt><dd id="detection">-</dd>
        <dt>Last bite</dt><dd id="last-bite">-</dd>
        <dt>Casts</dt><dd id="casts">0</dd>
        <dt>Bites</dt><dd id="bites">0</dd>
        <dt>Timeouts</dt><dd id="timeouts">0</dd>
      </dl>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="build" class="note"></p>
    </main>
  </body>
</html>
