<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title"></title>
  <meta name="description" data-i18n-attr="content:meta.description">
  <meta name="theme-color" content="#0f1a2e">
  <link rel="icon" href="assets/img/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="locales/en.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/demo-engine.js" defer></script>
  <script src="js/demo.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

  <header class="site-header">
    <nav class="container site-nav" data-i18n-attr="aria-label:nav.label">
      <a class="site-nav__brand" href="./">
        <img src="assets/img/icon.webp" width="32" height="32" alt="">
        <span data-i18n="nav.brand"></span>
      </a>
      <ul class="site-nav__links">
        <li><a href="./" aria-current="page" data-i18n="nav.home"></a></li>
        <li><a href="docs.html" data-i18n="nav.docs"></a></li>
        <li><a href="changelog.html" data-i18n="nav.changelog"></a></li>
        <li><a href="https://github.com/SpaceSquare640/Minecraft_Auto_Fishing" target="_blank" rel="noopener noreferrer"><span data-i18n="nav.github"></span><span class="visually-hidden" data-i18n="a11y.newTab"></span></a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <div class="hero__text">
          <div class="badge">
            <span data-i18n="hero.status"></span>
            <span class="badge__sparkle" aria-hidden="true"></span>
          </div>
          <h1 id="hero-title" class="hero__title" data-i18n="hero.title"></h1>
          <p class="hero__tagline" data-i18n="hero.tagline"></p>
          <p class="hero__desc" data-i18n="hero.description"></p>
          <div class="hero__actions">
            <a class="btn-block" href="#demo" data-i18n="hero.ctaDemo"></a>
            <a class="btn-github" href="https://github.com/SpaceSquare640/Minecraft_Auto_Fishing" target="_blank" rel="noopener noreferrer">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 0.296997C5.37 0.296997 0 5.67 0 12.297C0 17.6 3.438 22.097 8.205 23.682C8.805 23.795 9.025 23.424 9.025 23.105C9.025 22.82 9.015 22.065 9.01 21.065C5.672 21.789 4.968 19.455 4.968 19.455C4.422 18.07 3.633 17.7 3.633 17.7C2.546 16.956 3.717 16.971 3.717 16.971C4.922 17.055 5.555 18.207 5.555 18.207C6.625 20.042 8.364 19.512 9.05 19.205C9.158 18.429 9.467 17.9 9.81 17.6C7.145 17.3 4.344 16.268 4.344 11.67C4.344 10.36 4.809 9.29 5.579 8.45C5.444 8.147 5.039 6.927 5.684 5.274C5.684 5.274 6.689 4.952 8.984 6.504C9.944 6.237 10.964 6.105 11.984 6.099C13.004 6.105 14.024 6.237 14.984 6.504C17.264 4.952 18.269 5.274 18.269 5.274C18.914 6.927 18.509 8.147 18.389 8.45C19.154 9.29 19.619 10.36 19.619 11.67C19.619 16.28 16.814 17.295 14.144 17.59C14.564 17.95 14.954 18.686 14.954 19.81C14.954 21.416 14.939 22.706 14.939 23.096C14.939 23.411 15.149 23.786 15.764 23.666C20.565 22.092 24 17.592 24 12.297C24 5.67 18.627 0.296997 12 0.296997Z"/>
              </svg>
              <span data-i18n="hero.ctaGithub"></span>
              <span class="visually-hidden" data-i18n="a11y.newTab"></span>
            </a>
          </div>
        </div>
        <div class="hero__art">
          <figure class="hero-icon">
            <img src="assets/img/icon.webp" width="720" height="720" data-i18n-attr="alt:hero.iconAlt">
          </figure>
        </div>
      </div>
    </section>

    <section id="demo" class="section demo" aria-labelledby="demo-title">
      <div class="container">
        <h2 id="demo-title" class="section__title" data-i18n="demo.title"></h2>
        <p class="section__lead" data-i18n="demo.lead"></p>
        <p class="demo__disclaimer" data-i18n="demo.disclaimer"></p>

        <div class="demo__grid">
          <!-- Decorative: every state is also conveyed by the button, result text and log. -->
          <div class="demo__scene" data-phase="idle" data-mode="manual" aria-hidden="true">
            <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
              <rect width="160" height="90" fill="#16233d"/>
              <rect y="18" width="160" height="2" fill="#5a8f3a"/>
              <rect y="20" width="160" height="10" fill="#7a5230"/>
              <rect y="24" x="12" width="6" height="2" fill="#5e3f24"/>
              <rect y="26" x="84" width="8" height="2" fill="#5e3f24"/>
              <rect y="30" width="160" height="60" fill="#2a4f9e"/>
              <rect y="30" width="160" height="1" fill="#5b82d6"/>
              <rect y="44" x="8" width="30" height="1" fill="#3a63b8"/>
              <rect y="54" x="90" width="40" height="1" fill="#3a63b8"/>
              <rect y="70" width="160" height="20" fill="#1f3f84"/>
              <rect y="82" x="20" width="22" height="8" fill="#c9b98a"/>
              <rect y="78" x="128" width="18" height="12" fill="#c9b98a"/>
              <rect y="72" x="30" width="2" height="10" fill="#3f8a3a"/>
              <rect y="68" x="136" width="2" height="10" fill="#3f8a3a"/>

              <g class="scene__rod">
                <polyline points="160,30 152,25 144,20 136,15 128,10 120,5 114,2" fill="none" stroke="#7a5230" stroke-width="3"/>
                <rect x="146" y="18" width="5" height="5" fill="#f2c230"/>
                <rect x="147.5" y="19.5" width="2" height="2" fill="#7a5230"/>
              </g>
              <polyline class="scene__line" points="114,2 60,25" fill="none" stroke="#e8e2c8" stroke-width="0.6" shape-rendering="geometricPrecision"/>

              <g class="scene__bubbles" fill="#9cc0ff">
                <rect x="22" y="44" width="2" height="2"/>
                <rect x="30" y="41" width="2" height="2"/>
                <rect x="38" y="39" width="2" height="2"/>
                <rect x="46" y="36" width="2" height="2"/>
              </g>

              <g class="scene__bobber">
                <rect x="59.5" y="25" width="1" height="2" fill="#e8e2c8"/>
                <rect x="57" y="27" width="6" height="3" fill="#e23b3b"/>
                <rect x="58" y="27" width="2" height="1" fill="#ff8a8a"/>
                <rect x="57" y="30" width="6" height="3" fill="#f2f4f8"/>
              </g>

              <g class="scene__splash" fill="#cfe0ff">
                <rect x="52" y="29" width="2" height="2"/>
                <rect x="66" y="29" width="2" height="2"/>
                <rect x="55" y="26" width="2" height="2"/>
                <rect x="63" y="26" width="2" height="2"/>
              </g>

              <text class="scene__alert" x="60" y="20" text-anchor="middle">!</text>

              <g class="scene__fish">
                <rect x="52" y="10" width="14" height="6" class="fish__body"/>
                <rect x="50" y="11" width="2" height="4" class="fish__body"/>
                <rect x="66" y="9" width="3" height="8" class="fish__fin"/>
                <rect x="54" y="11" width="2" height="2" fill="#0f1a2e"/>
                <rect x="58" y="14" width="6" height="1" class="fish__fin"/>
              </g>
            </svg>
          </div>

          <div class="demo__panel">
            <fieldset class="lever">
              <legend class="lever__legend" data-i18n="demo.modeLabel"></legend>
              <!-- Adapted from Uiverse.io by chase2k25 (rare-quail-40), MIT -->
              <div class="lever__body">
                <div class="lever__track" aria-hidden="true"><div class="lever__groove"></div></div>
                <div class="lever__choices">
                  <div class="lever__choice">
                    <div class="lever__input-wrap">
                      <input class="lever__input" type="radio" name="demo-mode" id="demo-mode-manual" value="manual" checked>
                      <div class="lever__handle" aria-hidden="true"></div>
                    </div>
                    <label class="lever__label" for="demo-mode-manual" data-i18n="demo.manual"></label>
                  </div>
                  <div class="lever__choice">
                    <div class="lever__input-wrap">
                      <input class="lever__input" type="radio" name="demo-mode" id="demo-mode-auto" value="auto">
                      <div class="lever__handle" aria-hidden="true"></div>
                    </div>
                    <label class="lever__label" for="demo-mode-auto" data-i18n="demo.auto"></label>
                  </div>
                </div>
              </div>
            </fieldset>

            <button class="btn-block demo__action" type="button" data-demo-action></button>
            <p class="demo__result" data-demo-result></p>

            <table class="demo__stats">
              <caption class="visually-hidden" data-i18n="demo.stats.caption"></caption>
              <thead>
                <tr>
                  <th scope="col"><span class="visually-hidden" data-i18n="demo.stats.metric"></span></th>
                  <th scope="col" data-i18n="demo.manual"></th>
                  <th scope="col" data-i18n="demo.auto"></th>
                </tr>
              </thead>
              <tbody>
                <tr><th scope="row" data-i18n="demo.stats.caught"></th><td data-stat="manual.caught">0</td><td data-stat="auto.caught">0</td></tr>
                <tr><th scope="row" data-i18n="demo.stats.missed"></th><td data-stat="manual.missed">0</td><td data-stat="auto.missed">0</td></tr>
                <tr><th scope="row" data-i18n="demo.stats.best"></th><td data-stat="manual.best"></td><td data-stat="auto.best"></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <ol class="demo__log" role="log" data-i18n-attr="aria-label:demo.log.label" data-demo-log></ol>
        <div class="visually-hidden" aria-live="polite" data-demo-announcer></div>
      </div>
    </section>

    <!-- M3: how it works, features, getting started, FAQ, footer -->
  </main>
</body>
</html>
