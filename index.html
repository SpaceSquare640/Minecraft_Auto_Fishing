    <section id="demo" class="section demo" aria-labelledby="demo-title">
      <div class="container">
        <h2 id="demo-title" class="section__title" data-i18n="demo.title"></h2>
        <p class="section__lead" data-i18n="demo.lead"></p>
        <p class="demo__disclaimer" data-i18n="demo.disclaimer"></p>

        <div class="demo__grid">

          <div class="demo__scene" data-phase="idle" data-mode="manual" aria-hidden="true">
            <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
              <rect width="160" height="90" fill="#16233d"/>
              <rect y="18" width="160" height="2" fill="#5a8f3a"/>

              <rect y="26" x="84" width="8" height="2" fill="#5e3f24"/>
              <rect y="30" width="160" height="60" fill="#2a4f9e"/>
              <rect y="30" width="160" height="1" fill="#5b82d6"/>
              <rect y="44" x="8" width="30" height="1" fill="#3a63b8"/>
              <rect y="54" x="90" width="40" height="1" fill="#3a63b8"/>
              <rect y="70" width="160" height="20" fill="#1f3f84"/>
              <rect y="82" x="20" width="22" height="8" fill="#c9b98a"/>
              <rect y="78" x="128" width="18" height="12" fill="#c9b98a"/>
              <rect y="72" x="30" width="2" height="10" fill="#3f8a3a"/>
              <rect y="68" x="136" width="2" height="10" fill="#3f8a3a"/>

              <g class="scene__rod">
                <polyline points="160,30 152,25 144,20 136,15 128,10 120,5 114,2" fill="none" stroke="#7a5230" stroke-width="3"/>
                <rect x="146" y="18" width="5" height="5" fill="#f2c230"/>
                <rect x="147.5" y="19.5" width="2" height="2" fill="#7a5230"/>
              </g>
              <polyline class="scene__line" points="114,2 60,25" fill="none" stroke="#e8e2c8" stroke-width="0.6" shape-rendering="geometricPrecision"/>

              <g class="scene__bubbles" fill="#9cc0ff">
                <rect x="22" y="44" width="2" height="2"/>
                <rect x="30" y="41" width="2" height="2"/>
                <rect x="38" y="39" width="2" height="2"/>
                <rect x="46" y="36" width="2" height="2"/>
              </g>

              <g class="scene__bobber">
                <rect x="59.5" y="25" width="1" height="2" fill="#e8e2c8"/>
                <rect x="57" y="27" width="6" height="3" fill="#e23b3b"/>
                <rect x="58" y="27" width="2" height="1" fill="#ff8a8a"/>
                <rect x="57" y="30" width="6" height="3" fill="#f2f4f8"/>
              </g>

              <g class="scene__splash" fill="#cfe0ff">
                <rect x="52" y="29" width="2" height="2"/>
                <rect x="66" y="29" width="2" height="2"/>
                <rect x="55" y="26" width="2" height="2"/>
                <rect x="63" y="26" width="2" height="2"/>
              </g>

              <text class="scene__alert" x="60" y="20" text-anchor="middle">!</text>

              <g class="scene__fish">
                <rect x="52" y="10" width="14" height="6" class="fish__body"/>
                <rect x="50" y="11" width="2" height="4" class="fish__body"/>
                <rect x="66" y="9" width="3" height="8" class="fish__fin"/>
                <rect x="54" y="11" width="2" height="2" fill="#0f1a2e"/>
                <rect x="58" y="14" width="6" height="1" class="fish__fin"/>
              </g>
            </svg>
          </div>

          <div class="demo__panel">
            <fieldset class="lever">
              <legend class="lever__legend" data-i18n="demo.modeLabel"></legend>
              <!-- Adapted from Uiverse.io by chase2k25 (rare-quail-40), MIT -->
              <div class="lever__body">
                <div class="lever__track" aria-hidden="true"><div class="lever__groove"></div></div>
                <div class="lever__choices">
                  <div class="lever__choice">
                    <div class="lever__input-wrap">
                      <input class="lever__input" type="radio" name="demo-mode" id="demo-mode-manual" value="manual" checked>
                      <div class="lever__handle" aria-hidden="true"></div>
                    </div>
                    <label class="lever__label" for="demo-mode-manual" data-i18n="demo.manual"></label>
                  </div>
                  <div class="lever__choice">
                    <div class="lever__input-wrap">
                      <input class="lever__input" type="radio" name="demo-mode" id="demo-mode-auto" value="auto">
                      <div class="lever__handle" aria-hidden="true"></div>
                    </div>
                    <label class="lever__label" for="demo-mode-auto" data-i18n="demo.auto"></label>
                  </div>
                </div>
              </div>
            </fieldset>

            <button class="btn-block demo__action" type="button" data-demo-action></button>
            <p class="demo__result" data-demo-result></p>

            <table class="demo__stats">
              <caption class="visually-hidden" data-i18n="demo.stats.caption"></caption>
              <thead>
                <tr>
                  <th scope="col"><span class="visually-hidden" data-i18n="demo.stats.metric"></span></th>
                  <th scope="col" data-i18n="demo.manual"></th>
                  <th scope="col" data-i18n="demo.auto"></th>
                </tr>
              </thead>
              <tbody>
                <tr><th scope="row" data-i18n="demo.stats.caught"></th><td data-stat="manual.caught">0</td><td data-stat="auto.caught">0</td></tr>
                <tr><th scope="row" data-i18n="demo.stats.missed"></th><td data-stat="manual.missed">0</td><td data-stat="auto.missed">0</td></tr>
                <tr><th scope="row" data-i18n="demo.stats.best"></th><td data-stat="manual.best"></td><td data-stat="auto.best"></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div role="log" data-i18n-attr="aria-label:demo.log.label">
          <ol class="demo__log" data-demo-log></ol>
        </div>
        <div class="visually-hidden" aria-live="polite" data-demo-announcer></div>
      </div>
    </section>
