# CodeQL code scanning for the website's JavaScript and for the GitHub Actions workflows themselves.
# Results appear under the repository's Security > Code scanning tab.
# Same security rules as pages.yml (see README "CI/CD").

name: CodeQL

on:
  push:
    branches: [Minecraft_Auto_Fishing_Website_Preview]
  pull_request:
    branches: [Minecraft_Auto_Fishing_Website_Preview]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the code to analyze
      security-events: write # upload results to code scanning alerts
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}